[package]
name = "thriftp-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.1"
license = "MIT"

[lib]
name = "thriftp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
thriftp-core = { path = "../../../crates/thriftp-core" }
thriftp-protocols = { path = "../../../crates/thriftp-protocols" }
thriftp-credentials-keyring = { path = "../../../crates/thriftp-credentials-keyring" }
thriftp-storage-json = { path = "../../../crates/thriftp-storage-json" }
thriftp-mcp = { path = "../../../crates/thriftp-mcp" }
base64 = "0.22"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
