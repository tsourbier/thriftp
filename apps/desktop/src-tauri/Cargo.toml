[package]
name = "thriftp-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT"

[lib]
name = "thriftp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
thriftp-core = { path = "../../../crates/thriftp-core" }
thriftp-protocols = { path = "../../../crates/thriftp-protocols" }
thriftp-credentials-keyring = { path = "../../../crates/thriftp-credentials-keyring" }
thriftp-storage-json = { path = "../../../crates/thriftp-storage-json" }
thriftp-mcp = { path = "../../../crates/thriftp-mcp" }
base64 = "0.23.1"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time", "rt-multi-thread"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
tauri-plugin-dialog = "2.8.4"

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
