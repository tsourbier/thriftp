[workspace]
resolver = "2"
members = [
    "crates/thriftp-core",
    "crates/thriftp-protocols",
    "crates/thriftp-credentials-keyring",
    "crates/thriftp-storage-json",
    "crates/thriftp-cli",
    "crates/thriftp-mcp",
    "crates/thriftp-tests",
    "tests/integration",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
license = "MIT"
repository = "https://github.com/tsourbier/thriftp"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
criterion = "0.8.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand_core = "0.10.1"
rand = "0.10.3"
sha2 = "0.11.1"
keyring = "4.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
suppaftp = { version = "12.2.1", features = ["native-tls", "deprecated"] }
russh = "0.65.1"
russh-sftp = "3.0.1"
anyhow = "1.0.104"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "rt", "signal", "sync", "time"] }
trash = "5.3.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v5"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
